<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>월급반 — 수입 설명 색상 시안 4개</title>
<link rel="preload" href="../assets/fonts/pretendard.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Pretendard;src:url('../assets/fonts/pretendard.woff2') format('woff2');font-style:normal;font-weight:100 900;font-display:swap}
:root{color-scheme:dark;--font:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;--ui-ink:#f2f3f6;--ui-body:#bac1cc;--ui-blue:#7cb0ff}
*{box-sizing:border-box}body{margin:0;background:#12141a;color:var(--ui-ink);font:16px/1.8 var(--font);word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}h1,h2,p,ul{margin:0}button,a{-webkit-tap-highlight-color:transparent}a:focus-visible,button:focus-visible{outline:2px solid var(--ui-blue);outline-offset:4px}[hidden]{display:none!important}
.studio{position:sticky;top:0;z-index:20;background:#171920f5;backdrop-filter:blur(12px);border-bottom:1px solid #ffffff17}.bar{max-width:1440px;margin:auto;padding:14px 28px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}.brand{font-size:14px;font-weight:700}.tabs{display:flex;gap:5px;margin:auto}.tabs a{padding:5px 15px;border-radius:5px;font-size:13px;color:#b4bccb}.tabs a[aria-current=page]{background:#e9eff8;color:#152035}.site-link{font-size:12px;color:#b4bccb}.tools{max-width:1440px;margin:auto;padding:10px 28px;border-top:1px solid #ffffff17;display:flex;gap:20px;justify-content:space-between;align-items:center}.tools p{color:var(--ui-body);font-size:13px}.device-buttons{flex:none}.tools button{color:var(--ui-body);border:1px solid #ffffff25;border-radius:4px;background:transparent;font-size:12px;padding:5px 13px}.tools button[aria-pressed=true]{background:#e9eff8;color:#152035;border-color:#e9eff8}
.gallery{max-width:1440px;margin:auto;padding:44px 28px 72px}.gallery-head{display:flex;justify-content:space-between;align-items:end;gap:28px;margin-bottom:32px}.gallery-head h1{font-size:30px;letter-spacing:-.04em;line-height:1.4}.gallery-head p{color:var(--ui-body);font-size:14px;max-width:460px}.gallery-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;align-items:start}.card{border:1px solid #ffffff20;border-radius:10px;background:#1c1f28;overflow:hidden}.thumbnail{position:relative;display:block;width:100%;overflow:hidden;background:#090a0c;aspect-ratio:900/1310}.thumbnail iframe{display:block;position:absolute;top:0;left:0;border:0;width:900px;height:1310px;transform-origin:top left;pointer-events:none}.thumbnail::after{content:'크게 보기 ↗';position:absolute;right:16px;bottom:16px;background:#edf2fc;color:#17223a;padding:7px 13px;border-radius:30px;font-size:12px;font-weight:700}.caption{padding:24px}.caption h2{font-size:22px;line-height:1.4;letter-spacing:-.03em}.caption h2 span{font-size:13px;color:var(--ui-blue);margin-right:12px}.caption p{color:var(--ui-body);font-size:14px;margin-top:8px}.swatches{display:flex;gap:6px;margin-top:16px}.swatches i{width:22px;height:22px;border-radius:50%;border:1px solid #ffffff25}.viewer{display:block;border:0;width:100%;max-width:1440px;min-height:0;background:#090a0c;margin:0 auto}.viewer.mobile{width:390px;max-width:100%;border-inline:1px solid #ffffff25}.gallery-note{font-size:13px;color:#929cad;margin-top:28px}
/* A single layout and type scale; only these color tokens change. */
.variant-a{--paper:#f4f1eb;--ink:#202329;--body:#59616c;--accent:#285dc2;--highlight:#cfdef5;--rule:#20232926;--thread:#285dc266}
.variant-b{--paper:#eaf2ff;--ink:#142b4d;--body:#4d5e78;--accent:#225cc3;--highlight:#c7dbfc;--rule:#142b4d26;--thread:#225cc366}
.variant-c{--paper:#132641;--ink:#f5f8ff;--body:#bac9e1;--accent:#93bfff;--highlight:#2a5180;--rule:#bac9e130;--thread:#93bfff80}
.variant-d{--paper:#e7eee9;--ink:#18382f;--body:#4f675d;--accent:#2c6b56;--highlight:#b9d7c6;--rule:#18382f26;--thread:#2c6b5666}
.scene{background:#090a0c}.context{padding:48px 32px;color:#f2f3f6;background:#090a0c}.context-before{text-align:center}.context-before p{font-size:28px;font-weight:700;line-height:1.4;letter-spacing:-.04em}.context-before mark{color:inherit;background:linear-gradient(transparent 62%,#2b5ca08c 62%)}.context-after>div{max-width:760px;margin:auto}.context-after h2{font-size:28px;font-weight:700;line-height:1.4;letter-spacing:-.03em}.context-after p{margin-top:16px;font-size:16px;color:#9ba4b2}
.reality-stage{background:var(--paper);padding:76px 32px 72px;text-align:center;font-size:17px;line-height:1.85;color:var(--body)}.scene-copy{max-width:832px;margin:auto}.reality-limit,.reality-stage h1{margin:0;font-size:40px;font-weight:700;line-height:1.45;letter-spacing:-.04em;color:var(--ink)}.reality-stage mark{background:linear-gradient(transparent 62%,var(--highlight) 62%);color:inherit;padding:0 .04em;box-decoration-break:clone;-webkit-box-decoration-break:clone}.turn{display:flex;flex-direction:column;align-items:center;width:max-content;gap:12px;margin:28px auto;font-size:24px;font-weight:500;line-height:1.5;color:var(--body)}.turn::before,.turn::after{content:'';display:block;width:1px;height:34px;background:var(--thread)}.reality-proof{max-width:680px;margin:30px auto 0;font-size:20px;line-height:1.85}.reality-proof strong{font-size:inherit;font-weight:700;color:var(--ink);padding:0 .05em;background:linear-gradient(transparent 74%,var(--highlight) 74%)}.intro-details{width:100%;max-width:832px;padding:32px 0 0;margin:44px auto 0;border-top:1px solid var(--rule)}.intro-details>p{margin:0 0 22px}.intro-details>p:last-child{max-width:680px;margin:0 auto}.three{display:flex;justify-content:center;gap:24px;list-style:none;padding:0;margin:0 0 28px;color:var(--ink);font-weight:500}.three li{display:flex;align-items:center;gap:9px;padding:9px 0;line-height:1.8}.check{display:grid;place-items:center;width:21px;height:21px;flex:none;border:1px solid var(--thread);border-radius:50%;color:var(--accent)}.check svg{width:13px;height:13px}.intro-details strong{display:block;margin-top:6px;font-size:inherit;font-weight:500;color:var(--accent)}
@media(max-width:760px){.gallery-head{align-items:start;flex-direction:column;gap:14px}.bar{padding-inline:18px;gap:12px}.tabs{margin-left:auto;margin-right:0}.site-link{margin-left:auto}.tools{padding-inline:18px}.gallery{padding:30px 18px 50px}.gallery-grid{gap:20px}.reality-stage{padding-inline:24px}.three{flex-direction:column;align-items:center;gap:3px}.three li{min-width:220px}}
@media(max-width:640px){.tabs{order:3;width:100%;justify-content:space-between}.tabs a{padding:5px 12px}.gallery-grid{grid-template-columns:1fr}.gallery-head h1{font-size:25px}.tools{align-items:start;flex-direction:column;gap:9px}.caption{padding:20px}.context{padding:36px 20px}.context-before p,.context-after h2{font-size:21px}.context-after p{font-size:15px}.reality-stage{padding:48px 20px;font-size:16px}.reality-limit,.reality-stage h1{font-size:28px;line-height:1.5}.turn{font-size:21px;margin:24px auto;gap:10px}.turn::before,.turn::after{height:28px}.reality-proof{margin-top:26px;font-size:17px}.intro-details{margin-top:32px;padding-top:26px}.three{align-items:start;max-width:234px;margin:0 auto 26px}.three li{padding:8px 0}.intro-details strong{margin-top:5px}}
</style>
</head>
<body>
<header class="studio" id="studio">
 <div class="bar"><a class="brand" href="reality-color-concepts.html">월급반 · 섹션 색상 시안</a><nav class="tabs" aria-label="시안 선택"><a href="reality-color-concepts.html" data-tab="all">전체</a><a href="?concept=a" data-tab="a">A</a><a href="?concept=b" data-tab="b">B</a><a href="?concept=c" data-tab="c">C</a><a href="?concept=d" data-tab="d">D</a></nav><a class="site-link" href="/" target="_blank" rel="noopener">현재 랜딩 페이지 ↗</a></div>
 <div class="tools" id="tools" hidden><p id="summary"></p><div class="device-buttons"><button id="desktop" aria-pressed="true">PC</button> <button id="mobile" aria-pressed="false">모바일</button></div></div>
</header>
<main id="app"></main>
<noscript>시안을 보려면 브라우저의 JavaScript를 켜주세요.</noscript>
<template id="scene-template">
 <div class="context context-before"><p>누구나 꿈꾸지만,<br><mark>아무나 이룰 수 없는 목표</mark>입니다.</p></div>
 <section class="reality-stage" aria-labelledby="reality-title">
  <div class="scene-copy">
   <p class="reality-limit"><mark>비현실적인 수익</mark>은<br>약속할 수 없습니다.</p>
   <p class="turn">하지만</p>
   <h1 id="reality-title">월급만큼의 수입은<br><mark>현실적으로 가능</mark>합니다.</h1>
   <p class="reality-proof"><strong>9년간</strong> <strong>3,165명</strong>을 가르치고 내린 결론입니다.</p>
  </div>
  <div class="intro-details">
   <p>체계적인 관리 시스템하에</p>
   <ul class="three"><li>양질의 학습</li><li>체계적인 훈련</li><li>개인 맞춤 행동 교정</li></ul>
   <p>3가지를 일정 기간 이상, 꾸준히 반복한 분들은<strong>높은 확률로 월급 이상의 수입을 만들었습니다.</strong></p>
  </div>
 </section>
 <div class="context context-after"><div><h2>증거는 멀리 있지 않았습니다.</h2><p>글로벌트레이더협회는 늘 애널리스트, 코치진 인력난에 시달립니다.</p></div></div>
</template>
<script>
const concepts={
 a:{title:'웜 페이퍼',description:'따뜻한 종이색에 파란 강조. 블로그의 읽는 감각을 가장 자연스럽게 이어갑니다.',colors:['#f4f1eb','#202329','#285dc2','#cfdef5']},
 b:{title:'아이스 블루',description:'밝은 푸른 배경으로 확실한 전환. 기존 파란 하이라이트와 한 톤으로 연결됩니다.',colors:['#eaf2ff','#142b4d','#225cc3','#c7dbfc']},
 c:{title:'딥 네이비',description:'검정에서 깊은 남색으로. 어두운 분위기를 유지하면서 이 섹션에만 색을 줍니다.',colors:['#132641','#f5f8ff','#93bfff','#2a5180']},
 d:{title:'세이지',description:'옅은 초록과 짙은 먹색. 차분한 색의 변화로 현실적인 메시지에 집중합니다.',colors:['#e7eee9','#18382f','#2c6b56','#b9d7c6']}
};
const params=new URLSearchParams(location.search),requested=params.get('concept');
const concept=Object.hasOwn(concepts,requested)?requested:null,embedded=params.get('embed')==='1';
const app=document.getElementById('app');
function label(key){return key.toUpperCase()+' · '+concepts[key].title;}
if(concept&&embedded){
 document.getElementById('studio').remove();
 const scene=document.createElement('article');scene.className='scene variant-'+concept;
 scene.append(document.getElementById('scene-template').content.cloneNode(true));app.append(scene);
 scene.querySelectorAll('.three li').forEach(item=>{const icon=document.createElement('span');icon.className='check';icon.setAttribute('aria-hidden','true');icon.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"/></svg>';item.prepend(icon);});
 document.title=label(concept)+' — 월급반';
 const reportHeight=()=>parent.postMessage({type:'color-height',height:scene.getBoundingClientRect().height},location.origin);
 new ResizeObserver(reportHeight).observe(scene);window.addEventListener('load',reportHeight);document.fonts.ready.then(reportHeight);
}else if(concept){
 document.querySelector('[data-tab="'+concept+'"]').setAttribute('aria-current','page');
 document.getElementById('tools').hidden=false;document.getElementById('summary').textContent=label(concept)+' — '+concepts[concept].description;
 const frame=document.createElement('iframe');frame.className='viewer';frame.title=label(concept);frame.src='?concept='+concept+'&embed=1';app.append(frame);
 window.addEventListener('message',event=>{if(event.origin===location.origin&&event.source===frame.contentWindow&&event.data?.type==='color-height'&&Number.isFinite(event.data.height)&&event.data.height>0&&event.data.height<10000)frame.style.height=Math.ceil(event.data.height)+'px';});
 function setMobile(mobile){frame.classList.toggle('mobile',mobile);document.getElementById('mobile').setAttribute('aria-pressed',String(mobile));document.getElementById('desktop').setAttribute('aria-pressed',String(!mobile));}
 document.getElementById('mobile').addEventListener('click',()=>setMobile(true));document.getElementById('desktop').addEventListener('click',()=>setMobile(false));
}else{
 document.querySelector('[data-tab="all"]').setAttribute('aria-current','page');
 app.innerHTML='<div class="gallery"><div class="gallery-head"><h1>같은 글, 네 가지 색의 전환.</h1><p>선택한 Pretendard와 글자 크기·간격은 그대로.<br>앞뒤의 어두운 섹션과 이어지는 모습을 함께 비교해보세요.</p></div><div class="gallery-grid"></div><p class="gallery-note">각 시안을 누르면 크게 볼 수 있습니다. PC·모바일 화면으로도 비교할 수 있습니다.</p></div>';
 const grid=document.querySelector('.gallery-grid');
 Object.keys(concepts).forEach(key=>{
  const card=document.createElement('article');card.className='card';
  card.innerHTML='<a class="thumbnail" href="?concept='+key+'" aria-label="'+label(key)+' 크게 보기"><iframe src="?concept='+key+'&embed=1" title="'+label(key)+' 미리보기" tabindex="-1"></iframe></a><div class="caption"><h2><span>'+key.toUpperCase()+'</span>'+concepts[key].title+'</h2><p>'+concepts[key].description+'</p><div class="swatches" aria-hidden="true">'+concepts[key].colors.map(color=>'<i style="background:'+color+'"></i>').join('')+'</div></div>';
  grid.append(card);
  const thumb=card.querySelector('.thumbnail'),frame=card.querySelector('iframe');let height=1310;
  function resize(){const scale=thumb.clientWidth/900;frame.style.transform='scale('+scale+')';thumb.style.height=(height*scale)+'px';frame.style.height=height+'px';}
  new ResizeObserver(resize).observe(thumb);
  window.addEventListener('message',event=>{if(event.origin===location.origin&&event.source===frame.contentWindow&&event.data?.type==='color-height'&&Number.isFinite(event.data.height)&&event.data.height>0&&event.data.height<10000){height=Math.ceil(event.data.height);resize();}});
 });
}
</script>
</body>
</html>
