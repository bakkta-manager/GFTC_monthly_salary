    <h2>과정 기간 동안 함께 제공됩니다.</h2>
    <p class="sub">교육과 훈련 외에 매일의 매매를 돕는 것들입니다.</p>
    <ul class="blist">
      <li><b>시황</b><p>아침·점심·저녁, 주요 시장 흐름과 주목해야 할 포인트를 정리해 드립니다. 하루 동안 달라지는 시장을 살펴보며 자신의 매매 계획을 점검할 때 참고할 수 있습니다.</p></li>
      <li><b>타점 교육</b><p>진입의 근거와 기다려야 할 상황을 배웁니다. 타점 판단 과정을 이해하고 자신만의 매매 기준을 세우는 교육입니다.</p></li>
      <li><b>협회장 라이브트레이딩</b><p>협회장의 매매 과정을 실시간으로 살펴봅니다. 시장 상황을 어떻게 해석하고 매매를 결정하는지 보며 배운 기준이 실전에서 어떻게 적용되는지 익힙니다.</p></li>
      <li><b>W.E.T</b><p>자신의 트레이딩 행동을 돌아보고 개선할 부분을 찾도록 돕는 인공지능입니다. 반복되는 매매 습관을 점검하고 스스로 정한 원칙을 지키도록 행동 교정을 돕습니다.</p></li>
      <li><b>뉴스</b><p>시장에 영향을 줄 수 있는 주요 뉴스를 전해 드립니다. 가격 움직임의 배경을 이해하고 매매 전 확인해야 할 이슈를 살펴볼 때 참고할 수 있습니다.</p></li>
      <li><b>수강생·졸업생 채팅방과 커뮤니티</b><p>같은 과정을 거치는 수강생, 먼저 거쳐 간 졸업생과 한 공간에서 이야기합니다. 매매 고민을 나누고 서로의 복기를 보며, 과정이 끝난 뒤에도 혼자 남지 않도록 돕습니다.</p></li>

];
const params=new URLSearchParams(location.search),requested=params.get('concept');
const concept=requested==='o'||Object.hasOwn(CONCEPTS,requested)?requested:null;
const embedded=params.get('embed')==='1',still=params.get('still')==='1';
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
const app=document.querySelector('#app');
const nameFor=key=>key==='o'?'원문':CONCEPTS[key].title;

function initializeArticle(){
 const article=document.createElement('article');article.className='benefit-scene benefit-'+concept;
 article.append(document.querySelector('#siteNav').content.cloneNode(true));article.append(document.querySelector('#benefitContent').content.cloneNode(true));app.append(article);
 article.querySelector('.nav a').href='/#apply';article.querySelector('.nav a').target='_top';
 if(concept!=='o'){
  article.querySelector('h2').classList.add('reveal');
  article.querySelectorAll('.blist li').forEach((item,i)=>{
   item.classList.add('reveal');
   if(concept==='b'){const title=item.querySelector('b');const span=document.createElement('span');span.className='title-ink';span.textContent=title.textContent;title.replaceChildren(span);}
   if(concept==='e'){
    const paragraph=item.querySelector('p'),text=paragraph.textContent,split=text.indexOf('. ');
    const lead=document.createElement('span');lead.className='sentence-lead';lead.textContent=split<0?text:text.slice(0,split+1);
    paragraph.replaceChildren(lead);
    if(split>=0){const rest=document.createElement('span');rest.className='sentence-rest';rest.textContent=text.slice(split+1);paragraph.append(rest);}
   }
   if(concept==='f'){
    const icon=document.createElementNS('http://www.w3.org/2000/svg','svg');icon.classList.add('benefit-icon');icon.setAttribute('viewBox','0 0 24 24');icon.setAttribute('fill','none');icon.setAttribute('stroke','currentColor');icon.setAttribute('stroke-width','1.4');icon.setAttribute('stroke-linecap','round');icon.setAttribute('stroke-linejoin','round');icon.setAttribute('aria-hidden','true');icon.innerHTML=ICON_PATHS[i];item.prepend(icon);
   }
  });
 }
 const note=document.createElement('div');note.className='benefit-note';note.innerHTML='<span>제공 혜택 · '+nameFor(concept)+'</span><a href="/" target="_top">현재 페이지 보기 ↗</a>';article.append(note);
 if(!still&&!reducedMotion.matches&&concept!=='o'){
  document.body.classList.add('animate-on');
  const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('visible');observer.unobserve(entry.target);}}),{threshold:.12});
  article.querySelectorAll('.reveal').forEach(el=>observer.observe(el));
  reducedMotion.addEventListener('change',()=>{if(reducedMotion.matches)document.body.classList.remove('animate-on');});
 }
 const reportHeight=()=>parent.postMessage({type:'benefit-height',height:article.getBoundingClientRect().height},location.origin);
 new ResizeObserver(reportHeight).observe(article);window.addEventListener('load',reportHeight);document.fonts.ready.then(reportHeight);
}

if(embedded&&concept){document.querySelector('#studioBar').remove();initializeArticle();document.title='제공 혜택 / '+nameFor(concept)+' — 월급반';}
else if(concept){
 document.querySelector('[data-tab="'+concept+'"]').setAttribute('aria-current','page');document.querySelector('#studioTools').hidden=false;
 document.querySelector('#conceptSummary').textContent=nameFor(concept)+' · '+(concept==='o'?'현재 페이지의 구성입니다.':CONCEPTS[concept].description);
 app.innerHTML='<div class="viewer-wrap"><iframe class="viewer-frame" id="viewerFrame" title="제공 혜택 '+nameFor(concept)+' 시안" src="?concept='+concept+'&embed=1"></iframe></div>';
 const frame=document.querySelector('#viewerFrame');
 window.addEventListener('message',event=>{if(event.origin===location.origin&&event.source===frame.contentWindow&&event.data?.type==='benefit-height')frame.style.height=Math.ceil(event.data.height)+'px';});
 function setViewport(mobile){frame.classList.toggle('mobile',mobile);document.querySelector('#desktopBtn').setAttribute('aria-pressed',String(!mobile));document.querySelector('#mobileBtn').setAttribute('aria-pressed',String(mobile));}
 document.querySelector('#mobileBtn').addEventListener('click',()=>setViewport(true));document.querySelector('#desktopBtn').addEventListener('click',()=>setViewport(false));
 document.querySelector('#replayBtn').addEventListener('click',()=>{window.scrollTo({top:0,behavior:'instant'});frame.contentWindow.location.reload();});
}else{
 document.querySelector('[data-tab="all"]').setAttribute('aria-current','page');
 app.innerHTML='<div class="gallery"><header class="gallery-head"><div><p class="overline">글이 중심이 되는 디자인</p><h1>제공 혜택 · 여섯 가지 변주</h1></div><p>내용은 그대로, 읽는 방식은 다르게.<br>시안을 눌러 원문 · 모바일 화면과 비교하세요.</p></header><div class="gallery-grid">'+Object.entries(CONCEPTS).map(([key,value])=>'<article class="concept-card"><a class="thumbnail" href="?concept='+key+'" aria-label="'+key.toUpperCase()+' '+value.title+' 보기"><iframe src="?concept='+key+'&embed=1&still=1" title="'+value.title+' 미리보기" tabindex="-1" aria-hidden="true" loading="lazy"></iframe></a><div class="card-caption"><h2><span>'+key.toUpperCase()+'</span>'+value.title+'</h2><p>'+value.description+'</p><div class="tags">'+value.tags.map(tag=>'<span>'+tag+'</span>').join('')+'</div></div></article>').join('')+'</div><p class="gallery-note">시황 · 타점 교육 · 협회장 라이브트레이딩 · W.E.T · 뉴스 · 커뮤니티의 원문과 순서를 유지했습니다.<br>앞서 선택한 문제 구간 C 기록형과 통일감을 원하면 B, 기존 두 열 구성을 살리려면 D가 자연스럽습니다.</p></div>';
 const thumbnails=[...document.querySelectorAll('.thumbnail')];
 const observer=new ResizeObserver(entries=>entries.forEach(entry=>{entry.target.querySelector('iframe').style.transform='scale('+entry.contentRect.width/900+')';}));thumbnails.forEach(el=>observer.observe(el));
 window.addEventListener('message',event=>{
  if(event.origin!==location.origin||event.data?.type!=='benefit-height')return;
  const thumbnail=thumbnails.find(el=>el.querySelector('iframe').contentWindow===event.source);if(!thumbnail)return;
  const height=Math.ceil(event.data.height);thumbnail.style.aspectRatio='900 / '+height;thumbnail.querySelector('iframe').style.height=height+'px';
 });
}
</script></body></html>
