<style>

.variant-b .argument{padding-left:28px;border-left:1px solid #8badde3d}.variant-b .bridge{display:block;margin:38px 0 30px;font-size:17px;line-height:1.6}.variant-b .bridge:before{position:absolute;left:-32px;top:10px;width:7px;height:7px;border-radius:50%;background:#8db7f6;box-shadow:0 0 0 5px var(--bg)}.variant-b .bridge:after{display:none}.variant-b .after-head h2{letter-spacing:-.025em}

2px}}

<header class="studio-bar" id="studioBar"><div class="studio-top"><a href="intro-connection-concepts.html" class="studio-brand">월급반 <small>자연스럽게 이어지는 도입</small></a><nav class="tabs" aria-label="시안 선택"><a href="intro-connection-concepts.html" data-tab="all">전체 비교</a><a href="?concept=base" data-tab="base">현재 배치</a><a href="?concept=a" data-tab="a">A · 추천</a><a href="?concept=b" data-tab="b">B</a><a href="?concept=c" data-tab="c">C</a><a href="?concept=d" data-tab="d">D</a></nav><a class="original" href="/" target="_blank" rel="noopener">실제 페이지 ↗</a></div><div class="studio-tools" id="studioTools" hidden><p class="concept-summary" id="conceptSummary"></p><div class="tool-buttons"><button id="desktopBtn" aria-pressed="true">PC</button><button id="mobileBtn" aria-pressed="false">모바일</button><button id="replayBtn">↻ 다시 보기</button></div></div></header><main id="app"></main>
<template id="sceneTemplate"><nav class="nav">
  <div class="wrap">
    <div class="brand"><b>월급반</b><span>글로벌트레이더협회</span></div>
    <a class="btn gold" href="/#apply" target="_top">상담 신청</a>
  </div>
</nav><div class="story"><div class="argument"><header class="intro-before reveal">
  <ul class="hype" aria-label="흔한 과장 광고 문구"><li>"코인 대박 나서 건물 샀습니다"</li><li>"트레이딩으로 수십억 벌었습니다"</li></ul>
  <h1>누구나 꿈꾸지만,<br><mark>아무나 이룰 수 없는 목표</mark>입니다.</h1>
  <p class="lead">트레이딩을 가르치는 입장이지만<br>비현실적인 수익은 약속할 수 없습니다.</p>
</header><p class="bridge"><span>하지만</span></p><section class="intro-after"><div class="after-head reveal">
  <h2>월급만큼의 수입은<br><mark>현실적으로 가능</mark>합니다.</h2>
  <p>9년간 3,165명을 가르쳐본 결과 내린 결론입니다.</p></div><div class="details">
  <p>체계적인 관리 시스템하에</p>
  <ul class="three"><li>양질의 학습</li><li>체계적인 훈련</li><li>개인 맞춤 행동 교정</li></ul>
  <p>3가지를 일정 기간 이상, 꾸준히 반복한 분들은<br><strong>높은 확률로 월급 이상의 수입을 만들었습니다.</strong></p>
</div></section></div></div></template>
<script>
const CONCEPTS={
 a:{title:'본문 흐름형',description:'연결도 글의 시작선으로. 위에서 아래로 읽는 흐름을 그대로 잇습니다.',tags:['추천','왼쪽으로 이어지는 선','차분한 문단 간격']},
 b:{title:'여백 기록형',description:'본문 옆의 얇은 세로선 위에 생각이 바뀌는 지점을 표시합니다.',tags:['노트의 여백선','연속되는 읽기','작은 전환 표시']},
 c:{title:'문장 전환형',description:'‘하지만’을 다음 제목과 묶어 하나의 문장처럼 이어 읽습니다.',tags:['문장에 붙인 전환','제목 옆 세로선','낮은 장식 밀도']},
 d:{title:'도입 정렬형',description:'도입과 제목의 중심을 맞추고, 이어지는 설명은 편하게 왼쪽으로 읽습니다.',tags:['도입의 중앙 정렬','같은 축의 연결','본문은 왼쪽 정렬']}
};
const params=new URLSearchParams(location.search),requested=params.get('concept');
const concept=requested==='base'||Object.hasOwn(CONCEPTS,requested)?requested:null;
const embedded=params.get('embed')==='1',still=params.get('still')==='1';
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)'),app=document.querySelector('#app');
const nameFor=key=>key==='base'?'현재 배치':key.toUpperCase()+' · '+CONCEPTS[key].title;
function initializeScene(){
 const scene=document.createElement('article');scene.className='scene variant-'+concept;scene.append(document.querySelector('#sceneTemplate').content.cloneNode(true));app.append(scene);
 const note=document.createElement('footer');note.className='scene-note';note.innerHTML='<span>도입부 연결 · '+nameFor(concept)+'</span><a href="/" target="_top">실제 페이지 보기 ↗</a>';scene.append(note);
 if(!still&&!reducedMotion.matches&&'IntersectionObserver' in window){scene.classList.add('animate');const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('visible');observer.unobserve(entry.target);}}),{threshold:.1});scene.querySelectorAll('.reveal').forEach(el=>observer.observe(el));reducedMotion.addEventListener('change',()=>{if(reducedMotion.matches){scene.classList.remove('animate');observer.disconnect();}});}
 const reportHeight=()=>parent.postMessage({type:'connection-height',height:scene.getBoundingClientRect().height},location.origin);new ResizeObserver(reportHeight).observe(scene);window.addEventListener('load',reportHeight);document.fonts.ready.then(reportHeight);
}
if(embedded&&concept){document.querySelector('#studioBar').remove();initializeScene();document.title=nameFor(concept)+' — 월급반';}
else if(concept){
 document.querySelector('[data-tab="'+concept+'"]').setAttribute('aria-current','page');document.querySelector('#studioTools').hidden=false;document.querySelector('#conceptSummary').textContent=nameFor(concept)+' · '+(concept==='base'?'현재 적용된 중앙 연결과 비교해보세요.':CONCEPTS[concept].description);
 app.innerHTML='<div class="viewer-wrap"><iframe class="viewer-frame" id="viewerFrame" title="'+nameFor(concept)+'" src="?concept='+concept+'&embed=1"></iframe></div>';const frame=document.querySelector('#viewerFrame');
 window.addEventListener('message',event=>{if(event.origin===location.origin&&event.source===frame.contentWindow&&event.data?.type==='connection-height'&&Number.isFinite(event.data.height))frame.style.height=Math.ceil(event.data.height)+'px';});
 function setViewport(mobile){frame.classList.toggle('mobile',mobile);document.querySelector('#desktopBtn').setAttribute('aria-pressed',String(!mobile));document.querySelector('#mobileBtn').setAttribute('aria-pressed',String(mobile));}
 document.querySelector('#mobileBtn').addEventListener('click',()=>setViewport(true));document.querySelector('#desktopBtn').addEventListener('click',()=>setViewport(false));document.querySelector('#replayBtn').addEventListener('click',()=>{window.scrollTo({top:0,behavior:'instant'});frame.contentWindow.location.reload();});
}else{
 document.querySelector('[data-tab="all"]').setAttribute('aria-current','page');
 app.innerHTML='<div class="gallery"><header class="gallery-head"><div><p class="overline">글의 흐름에 맞춘 연결</p><h1>도입부, 자연스럽게 이어가기</h1></div><p>같은 글, 네 가지 연결 방식.<br>본문과 시선이 이어지는 <strong>A안을 추천</strong>합니다.</p></header><div class="gallery-grid">'+Object.entries(CONCEPTS).map(([key,value])=>'<article class="concept-card"><a class="thumbnail" href="?concept='+key+'" aria-label="'+nameFor(key)+' 보기"><iframe src="?concept='+key+'&embed=1&still=1" title="'+nameFor(key)+' 미리보기" tabindex="-1" aria-hidden="true" loading="lazy"></iframe></a><div class="card-caption"><h2><span>'+key.toUpperCase()+'</span>'+value.title+(key==='a'?'<small class="recommendation">추천</small>':'')+'</h2><p>'+value.description+'</p><div class="tags">'+value.tags.map(tag=>'<span>'+tag+'</span>').join('')+'</div></div></article>').join('')+'</div><p class="gallery-note">A는 현재 블로그의 읽는 방향을 가장 자연스럽게 유지합니다. B는 기록 같은 분위기, C는 문장의 연결, D는 도입부의 정렬에 집중했습니다.<br>상단에서 현재 배치와 비교하고 각 시안을 PC·모바일로 확인할 수 있습니다.</p></div>';
 const thumbnails=[...document.querySelectorAll('.thumbnail')];const observer=new ResizeObserver(entries=>entries.forEach(entry=>{entry.target.querySelector('iframe').style.transform='scale('+entry.contentRect.width/900+')';}));thumbnails.forEach(el=>observer.observe(el));
 window.addEventListener('message',event=>{if(event.origin!==location.origin||event.data?.type!=='connection-height'||!Number.isFinite(event.data.height))return;const thumbnail=thumbnails.find(el=>el.querySelector('iframe').contentWindow===event.source);if(!thumbnail)return;const height=Math.ceil(event.data.height);thumbnail.style.aspectRatio='900 / '+height;thumbnail.querySelector('iframe').style.height=height+'px';});
}
