<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빨간 취소선 시안 4개</title>
<style>
@font-face{font-family:Pretendard;src:url("../assets/fonts/pretendard.woff2") format("woff2");font-weight:100 900;font-display:swap}
*{box-sizing:border-box}
body{margin:0;font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;color:#202329;background:#e9ecf3;letter-spacing:-.02em}
.tag{position:sticky;top:0;z-index:5;margin:0;padding:10px 20px;background:#111;color:#fff;font-size:14px;font-weight:700;letter-spacing:.08em}
section{position:relative;overflow:hidden;padding:110px 24px;text-align:center;background:linear-gradient(180deg,#fbfcff,#f3f6fc)}
.big{margin:0;font-size:clamp(40px,5vw,84px);font-weight:700;line-height:1.2;letter-spacing:-.045em;color:#9aa1ad;word-break:keep-all}
.s{position:relative;display:inline-block;white-space:nowrap}
.s svg{position:absolute;pointer-events:none;overflow:visible;z-index:1}
.s path,.s line{vector-effect:non-scaling-stroke}
.s{isolation:isolate}
.replay{display:inline-block;margin-top:40px;padding:10px 18px;border-radius:999px;border:1px solid #dfe4ec;background:#fff;font:600 14px Pretendard;cursor:pointer;color:#5d6680}

/* S-A 손그림 마커 */
.sa .s svg{left:-3%;right:-3%;width:106%;top:38%;height:.3em}
.sa .s path{fill:none;stroke:#e5484d;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.1s cubic-bezier(.22,1,.36,1) .3s forwards;filter:drop-shadow(0 4px 10px rgba(229,72,77,.35))}
/* S-B 더블 라인 */
.sb .s svg{left:-2%;right:-2%;width:104%;top:40%;height:.26em}
.sb .s line{stroke:#e5484d;stroke-width:4.5;stroke-linecap:round;stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw .8s cubic-bezier(.22,1,.36,1) forwards}
.sb .s line:nth-child(1){animation-delay:.3s}.sb .s line:nth-child(2){animation-delay:.55s;opacity:.7}
/* S-C 브러시 하이라이트 + 선 */
.sc .s::before{content:"";position:absolute;left:-.1em;right:-.1em;top:18%;height:76%;border-radius:.12em .4em .14em .5em/.5em .14em .4em .12em;background:linear-gradient(90deg,rgba(229,72,77,.10),rgba(229,72,77,.22) 50%,rgba(229,72,77,.10));transform:rotate(-1.2deg) scaleX(0);transform-origin:left;animation:swipe .7s cubic-bezier(.22,1,.36,1) .2s forwards;z-index:-1}
.sc .s svg{left:-2%;right:-2%;width:104%;top:44%;height:.14em}
.sc .s line{stroke:#e5484d;stroke-width:5;stroke-linecap:round;stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw .7s cubic-bezier(.22,1,.36,1) .7s forwards}
.sc .s{color:#7d8591}
/* S-D 그라데이션 글로우 라인 + 고스트 텍스트 */
.sd .s{color:#b4bac4;transition:filter .6s}
.sd .s.on{filter:blur(.6px)}
.sd .s svg{left:-4%;right:-4%;width:108%;top:41%;height:.22em}
.sd .s line{stroke:url(#gradred);stroke-width:8;stroke-linecap:round;stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw .9s cubic-bezier(.22,1,.36,1) .3s forwards;filter:drop-shadow(0 0 10px rgba(255,90,90,.6)) drop-shadow(0 6px 16px rgba(229,72,77,.35))}
.sd .s::after{content:"✕";position:absolute;z-index:2;right:-.9em;top:-.25em;width:.6em;height:.6em;display:grid;place-items:center;border-radius:50%;background:#e5484d;color:#fff;font-size:.42em;font-weight:800;box-shadow:0 8px 20px -6px rgba(229,72,77,.8);opacity:0;transform:scale(.4);animation:pop .5s cubic-bezier(.2,.9,.3,1.4) 1.1s forwards}

@keyframes draw{to{stroke-dashoffset:0}}
@keyframes swipe{to{transform:rotate(-1.2deg) scaleX(1)}}
@keyframes pop{to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>

<p class="tag">S-A · 손그림 마커 (두껍고 거친 한 획)</p>
<section class="sa"><p class="big"><span class="s">비현실적인 수익<svg viewBox="0 0 400 40" preserveAspectRatio="none"><path d="M4 26 C 60 18, 120 30, 180 22 S 300 14, 396 20"/></svg></span>은<br>약속할 수 없습니다.</p><button class="replay" onclick="replay(this)">다시 재생</button></section>

<p class="tag">S-B · 더블 라인 (두 줄 겹침)</p>
<section class="sb"><p class="big"><span class="s">비현실적인 수익<svg viewBox="0 0 400 40" preserveAspectRatio="none"><line x1="6" y1="22" x2="394" y2="14"/><line x1="10" y1="30" x2="396" y2="24"/></svg></span>은<br>약속할 수 없습니다.</p><button class="replay" onclick="replay(this)">다시 재생</button></section>

<p class="tag">S-C · 브러시 하이라이트 + 얇은 선</p>
<section class="sc"><p class="big"><span class="s">비현실적인 수익<svg viewBox="0 0 400 20" preserveAspectRatio="none"><line x1="4" y1="14" x2="396" y2="6"/></svg></span>은<br>약속할 수 없습니다.</p><button class="replay" onclick="replay(this)">다시 재생</button></section>

<p class="tag">S-D · 글로우 그라데이션 라인 + ✕ 배지</p>
<section class="sd"><svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gradred" x1="0" x2="1"><stop offset="0" stop-color="#ff7a7a"/><stop offset=".5" stop-color="#e5484d"/><stop offset="1" stop-color="#ff9a5c"/></linearGradient></defs></svg><p class="big"><span class="s on">비현실적인 수익<svg viewBox="0 0 400 40" preserveAspectRatio="none"><line x1="2" y1="24" x2="398" y2="16"/></svg></span>은<br>약속할 수 없습니다.</p><button class="replay" onclick="replay(this)">다시 재생</button></section>

<script>
function replay(btn){var sec=btn.closest('section');var html=sec.innerHTML;sec.innerHTML=html;}
</script>
</body>
</html>
